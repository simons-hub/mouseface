name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    steps:
      # Pinned to a commit, not a movable tag, so a hijacked tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build with the .NET Framework compiler and run the unit tests
        shell: powershell
        run: .\install.ps1 -Test -UnitOnly -BuildDir "$env:RUNNER_TEMP\build"
